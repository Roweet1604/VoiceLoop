<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Applies a saved theme before React loads, so the page never flashes the
      wrong one. Keep in sync with src/lib/theme.js (same storage key).
      With nothing saved, theme.css follows the OS setting.
    -->
    <script>
      try {
        var t = localStorage.getItem("voiceloop-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
    />
    <meta
      name="description"
      content="VoiceLoop collects private customer feedback through QR codes and links, by text or voice, and helps businesses resolve complaints."
    />
    <title>VoiceLoop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
